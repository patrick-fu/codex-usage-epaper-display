name: UsageInk
options:
  bundleIdPrefix: com.patrickfu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  knownRegions:
    - en
    - zh-Hans
    - Base
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    COMBINE_HIDPI_IMAGES: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    COMPILER_INDEX_STORE_ENABLE: NO
targets:
  UsageInk:
    type: application
    platform: macOS
    sources:
      - path: src
        excludes:
          - "**/*.plist"
          - "**/*.strings"
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: UsageInk
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickfu.UsageInk
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_TESTABILITY: YES
  UsageInkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/UsageInkTests
    dependencies:
      - target: UsageInk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickfu.UsageInkTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UsageInk.app/Contents/MacOS/UsageInk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_TESTABILITY: YES

schemes:
  UsageInk:
    build:
      parallelizeBuild: false
      targets:
        UsageInk: all
        UsageInkTests: [test]
    test:
      targets:
        - UsageInkTests
